<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/icons/pen-tool.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkEstimate Pro - Calculadora para Tatuadores</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;700&family=Sacramento&family=UnifrakturMaguntia&family=Caveat:wght@400;700&family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Playfair+Display:wght@400;900&family=Pinyon+Script&family=Qwitcher+Grypen&family=Pirata+One&family=Special+Elite&family=Courier+Prime&family=VT323&family=Montserrat:wght@100;400;900&family=Bebas+Neue&family=Poppins:wght@100;900&family=Raleway:wght@100;400;900&family=Lato:wght@100;400;900&family=Roboto:wght@100;400;900&family=Open+Sans:wght@300;400;800&family=Julius+Sans+One&family=Poiret+One&family=Josefin+Sans:wght@100;400;700&family=Comfortaa:wght@300;700&family=Barlow:wght@100;400;900&family=Abel&family=Didact+Gothic&family=Questrial&family=Maven+Pro:wght@400;900&family=Geo&family=Wire+One&family=Stalemate&family=Monsieur+La+Doulaise&family=Herr+Von+Muellerhoff&family=Mrs+Saint+Delafield&family=WindSong&family=Allura&family=Parisienne&family=Italianno&family=Euphoria+Script&family=Qwigley&family=Ruthie&family=Petit+Formal+Script&family=Meddon&family=Cedarville+Cursive&family=Nothing+You+Could+Do&family=Shadows+Into+Light&family=Amatic+SC:wght@400;700&family=Waiting+for+the+Sunrise&family=La+Belle+Aurore&family=Homemade+Apple&family=Reenie+Beanie&family=Bad+Script&family=Marck+Script&family=Mr+Bedfort&family=Over+the+Rainbow&family=Germania+One&family=Sancreek&family=Rye&family=Diplomata&family=Metal+Mania&family=Bungee+Shade&family=Ewert&family=Shojumaru&family=Kaushan+Script&family=Cookie&family=Grand+Hotel&family=Satisfy&family=Courgette&family=Damion&family=Yellowtail&family=Rochester&family=Clicker+Script&family=Bilbo&family=Delius&family=Handlee&family=Patrick+Hand&family=Gloria+Hallelujah&family=Gochi+Hand&family=Indie+Flower&family=Kalam&family=Permanent+Marker&family=Rock+Salt&family=Covered+By+Your+Grace&family=Architects+Daughter&family=Pacifico&family=Lobster&family=Lobster+Two&family=Bungee&family=Urban+Jungle&family=Tangerine&family=Miss+Fajardose&family=Lovers+Quarrel&family=Kristi&family=Mr+De+Havilland&family=Rouge+Script&family=Bilbo+Swash+Caps&family=Butterfly+Kids&family=Princess+Sofia&family=Quintessential&family=Jim+Nightshade&family=Dr+Sugiyama&family=Felipa&family=Redressed&family=Vibur&family=Meie+Script&family=Aguafina+Script&family=Condiment&family=Dynalight&family=Eagle+Lake&family=Engagement&family=Griffy&family=Henny+Penny&family=Julee&family=Macondo+Swash&family=Miniver&family=Modern+Antiqua&family=Montez&family=Norican&family=Oleo+Script&family=Original+Surfer&family=Paprika&family=Rancho&family=Ribeye&family=Risque&family=Sail&family=Sarina&family=Seaweed+Script&family=Simonetta&family=Sirin+Stencil&family=Snowburst+One&family=Sonsie+One&family=Spirax&family=Supermercado+One&family=Trade+Winds&family=Trocchi&family=Trykker&family=Tulpen+One&family=Uncial+Antiqua&family=Underdog&family=Vast+Shadow&family=Warnes&family=Wellfleet&family=Wendy+One&family=Yesteryear&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Cinzel', 'serif'],
              script: ['Sacramento', 'cursive'],
              gothic: ['UnifrakturMaguntia', 'serif'],
            },
            colors: {
              ink: { 950: '#0a0a0a', 900: '#171717', 800: '#262626', 700: '#404040' },
              gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
              studioBlue: '#3b82f6' /* Azul do botão PREÇO do seu print */
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #0a0a0a; color: #e5e5e5; overflow-x: hidden; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #171717; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
      .input-studio { background: #171717; border: 1px solid #262626; padding: 0.75rem; border-radius: 0.5rem; color: white; width: 100%; }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createClient } = supabase;

        // --- CONEXÕES ---
        const GOOGLE_API_KEY = "AIzaSyBVUt_unky3f0D4qzDutg69HH7PxHQ6dso"; 
        const supabaseUrl = 'https://igmdplccgvlcfrffwgpm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnbWRwbGNjZ3ZsY2ZyZmZ3Z3BtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1OTM0NDYsImV4cCI6MjA4NDE2OTQ0Nn0.Uy9NGijSIXytVYw-19szOXdet96uiY8xHQlW36K7xAg';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        const Icon = ({ name, size = 20, className }) => <i data-lucide={name} style={{fontSize: size}} className={className}></i>;

        const App = () => {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [loading, setLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('price');
            
            // Dados da Calculadora (IGUAIS AO PRINT)
            const [clientName, setClientName] = useState('');
            const [studioName, setStudioName] = useState('');
            const [width, setWidth] = useState(7);
            const [height, setHeight] = useState(7);
            const [style, setStyle] = useState('Nível 1: Traços');
            const [bodyPart, setBodyPart] = useState('Braço/Antebraço');
            const [extras, setExtras] = useState(0);
            const [price, setPrice] = useState(null);

            useEffect(() => { lucide.createIcons(); }, [user, activeTab, price]);

            const handleLogin = async () => {
                setLoading(true);
                const { data } = await supabaseClient.from('clientes').select('*').eq('email', email.trim().toLowerCase()).single();
                if (data) setUser(data); else alert('E-mail não encontrado.');
                setLoading(false);
            };

            const calculate = () => {
                const area = width * height;
                let multiplier = 1;
                if (style.includes('Nível 2')) multiplier = 1.3;
                if (style.includes('Nível 3')) multiplier = 1.6;
                if (style.includes('Nível 4')) multiplier = 2.0;
                const total = Math.ceil((100 + (area * 3)) * multiplier + Number(extras));
                setPrice(total);
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-ink-900 p-8 rounded-xl border border-ink-800 w-full max-w-md text-center">
                            <h1 className="text-3xl font-display font-bold text-white mb-2">InkEstimate <span className="text-gold-500">Pro</span></h1>
                            <p className="text-zinc-500 mb-8">Acesso ao Sistema</p>
                            <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="Seu E-mail" className="input-studio text-center mb-4" />
                            <button onClick={handleLogin} disabled={loading} className="w-full bg-gold-500 text-black font-bold p-3 rounded hover:bg-gold-400">
                                {loading ? 'Entrando...' : 'ENTRAR'}
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <header className="flex justify-between items-center p-6 border-b border-ink-800">
                        <div className="flex items-center gap-2 font-display font-bold text-xl">
                            <div className="bg-gold-500/10 p-2 rounded"><Icon name="pen-tool" className="text-gold-500" /></div>
                            InkEstimate <span className="text-gold-500">Pro</span>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="bg-ink-900 border border-ink-800 px-3 py-1 rounded text-sm text-gold-500 font-bold">💰 {user.credits}</div>
                            <button onClick={() => setUser(null)}><Icon name="log-out" className="text-zinc-500 hover:text-white" /></button>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-4 mt-8">
                        {/* ABAS (IGUAIS AO PRINT - COM PREÇO AZUL) */}
                        <div className="flex gap-2 mb-8 overflow-x-auto">
                            {[
                                {id:'price', l:'PREÇO', i:'calculator', color:'bg-studioBlue'},
                                {id:'letras', l:'LETRAS', i:'type', color:'bg-ink-900'},
                                {id:'artes', l:'ARTES', i:'image', color:'bg-ink-900'},
                                {id:'insta', l:'INSTA', i:'instagram', color:'bg-ink-900'},
                                {id:'vendas', l:'VENDAS', i:'message-square', color:'bg-ink-900'},
                                {id:'jobs', l:'JOBS', i:'history', color:'bg-ink-900'}
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center justify-center p-4 rounded-xl min-w-[80px] transition-all ${activeTab === tab.id ? `${tab.color} text-white` : 'bg-ink-900 text-zinc-500 border border-ink-800'}`}>
                                    <Icon name={tab.i} />
                                    <span className="text-[10px] font-bold mt-1 tracking-widest">{tab.l}</span>
                                </button>
                            ))}
                        </div>

                        {/* INPUTS DE NOME */}
                        <div className="grid grid-cols-2 gap-4 mb-6">
                            <input type="text" value={clientName} onChange={e=>setClientName(e.target.value)} placeholder="Nome do Cliente" className="input-studio" />
                            <input type="text" value={studioName} onChange={e=>setStudioName(e.target.value)} placeholder="Seu Estúdio" className="input-studio" />
                        </div>

                        <div className="w-full h-px bg-gradient-to-r from-transparent via-ink-700 to-transparent mb-8"></div>

                        {activeTab === 'price' && (
                            <div className="grid md:grid-cols-2 gap-8">
                                <div className="space-y-6">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-zinc-500 mb-2 block uppercase">Largura (cm)</label>
                                            <input type="number" value={width} onChange={e=>setWidth(Number(e.target.value))} className="input-studio font-bold text-lg" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-zinc-500 mb-2 block uppercase">Altura (cm)</label>
                                            <input type="number" value={height} onChange={e=>setHeight(Number(e.target.value))} className="input-studio font-bold text-lg" />
                                        </div>
                                    </div>
                                    
                                    <div className="text-center text-gold-500 text-xs font-bold flex items-center justify-center gap-2">
                                        <Icon name="zap" size={12}/> Área Total: {width*height} cm²
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-zinc-500 mb-2 block uppercase">Estilo & Complexidade</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {['Nível 1: Traços', 'Nível 2: Sombreado', 'Nível 3: Colorido', 'Nível 4: Cobertura'].map(lvl => (
                                                <button key={lvl} onClick={()=>setStyle(lvl)} className={`p-3 rounded text-xs font-bold border ${style === lvl ? 'bg-white text-black border-white' : 'bg-ink-950 border-ink-800 text-zinc-500'}`}>
                                                    {lvl}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-zinc-500 mb-2 block uppercase">Local do Corpo</label>
                                            <select value={bodyPart} onChange={e=>setBodyPart(e.target.value)} className="input-studio text-xs">
                                                <option>Braço/Antebraço</option>
                                                <option>Perna/Panturrilha</option>
                                                <option>Costela/Barriga</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-gold-500 mb-2 block uppercase">Custos Extras (R$)</label>
                                            <input type="number" value={extras} onChange={e=>setExtras(Number(e.target.value))} className="input-studio" />
                                        </div>
                                    </div>

                                    <button onClick={calculate} className="w-full bg-white text-black font-black py-4 rounded-xl uppercase tracking-widest hover:bg-zinc-200 transition-all flex justify-center items-center gap-2">
                                        <Icon name="calculator" /> Somar e Calcular Orçamento (1 Moeda)
                                    </button>
                                </div>

                                <div className="bg-ink-900 border border-ink-800 rounded-2xl flex flex-col items-center justify-center p-10 text-center min-h-[300px]">
                                    {price ? (
                                        <div className="animate-in fade-in zoom-in">
                                            <Icon name="check-circle" className="text-green-500 w-12 h-12 mx-auto mb-4" />
                                            <p className="text-zinc-500 text-xs uppercase tracking-widest mb-2">Valor Sugerido</p>
                                            <div className="text-6xl font-display font-bold text-white mb-2">R$ {price}</div>
                                            <p className="text-zinc-500 text-sm">Estimativa para {width}x{height}cm</p>
                                        </div>
                                    ) : (
                                        <div className="opacity-30">
                                            <Icon name="dollar-sign" className="w-16 h-16 mx-auto mb-4" />
                                            <p>Preencha os dados ao lado para calcular.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                        
                        {activeTab !== 'price' && (
                            <div className="flex flex-col items-center justify-center h-64 text-zinc-500">
                                <Icon name="construction" className="w-12 h-12 mb-4 opacity-50"/>
                                <p>Módulo em desenvolvimento...</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
