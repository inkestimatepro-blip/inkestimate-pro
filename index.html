<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkEstimate Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              background: '#09090b',
              surface: '#18181b',
              border: '#27272a',
              primary: '#2563eb', // O Azul do seu print
              primaryHover: '#1d4ed8'
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #09090b; color: #e4e4e7; }
      .input-dark { background: #09090b; border: 1px solid #27272a; color: white; border-radius: 0.5rem; outline: none; }
      .input-dark:focus { border-color: #2563eb; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createClient } = supabase;

        // --- CONFIGURAÇÕES ---
        const GOOGLE_API_KEY = "AIzaSyBVUt_unky3f0D4qzDutg69HH7PxHQ6dso"; 
        const supabaseUrl = 'https://igmdplccgvlcfrffwgpm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnbWRwbGNjZ3ZsY2ZyZmZ3Z3BtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1OTM0NDYsImV4cCI6MjA4NDE2OTQ0Nn0.Uy9NGijSIXytVYw-19szOXdet96uiY8xHQlW36K7xAg';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        // --- IA ---
        async function callGemini(prompt) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GOOGLE_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Erro na IA.";
            } catch (error) { return "Erro de conexão."; }
        }

        const Icon = ({ name, size=20 }) => <i data-lucide={name} style={{fontSize: size}}></i>;

        const App = () => {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [loading, setLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('price');
            
            // Dados Calculadora (Iguais ao print)
            const [clientName, setClientName] = useState('');
            const [studioName, setStudioName] = useState('');
            const [width, setWidth] = useState(7);
            const [height, setHeight] = useState(7);
            const [style, setStyle] = useState('Nível 1: Traços');
            const [bodyPart, setBodyPart] = useState('Braço/Antebraço');
            const [extras, setExtras] = useState(0);
            const [result, setResult] = useState(null);

            // Dados IA
            const [aiInput, setAiInput] = useState('');
            const [aiResult, setAiResult] = useState('');
            const [aiLoading, setAiLoading] = useState(false);

            useEffect(() => { lucide.createIcons(); }, [user, activeTab, result, aiResult]);

            const handleLogin = async () => {
                setLoading(true);
                const { data } = await supabaseClient.from('clientes').select('*').eq('email', email.trim().toLowerCase()).single();
                if (data) setUser(data); else alert('E-mail não encontrado.');
                setLoading(false);
            };

            const calculate = () => {
                // Lógica aproximada baseada nos inputs
                const area = width * height;
                let multiplier = 1;
                if (style.includes('Nível 2')) multiplier = 1.3;
                if (style.includes('Nível 3')) multiplier = 1.6;
                if (style.includes('Nível 4')) multiplier = 2.0;
                
                let bodyMult = 1;
                if (bodyPart === 'Costela/Barriga') bodyMult = 1.5;
                if (bodyPart === 'Pescoço/Rosto') bodyMult = 1.8;

                const basePrice = 100;
                const price = Math.ceil(((basePrice + (area * 3)) * multiplier * bodyMult) + Number(extras));
                setResult(price);
            };

            const runAI = async (type) => {
                if (!aiInput) return alert('Digite algo!');
                setAiLoading(true);
                const prompt = type === 'stencil' 
                    ? `Crie um guia de stencil para: ${aiInput}.` 
                    : `Crie uma legenda de Instagram para: ${aiInput}.`;
                const text = await callGemini(prompt);
                setAiResult(text);
                setAiLoading(false);
            };

            // TELA DE LOGIN
            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-surface p-8 rounded-xl border border-border w-full max-w-md text-center">
                            <h1 className="text-3xl font-bold text-white mb-2">InkEstimate <span className="text-primary">Pro</span></h1>
                            <p className="text-zinc-500 mb-8">Login de Acesso</p>
                            
                            <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="Seu E-mail" className="w-full bg-background border border-border p-3 rounded mb-4 text-white text-center" />
                            <button onClick={handleLogin} disabled={loading} className="w-full bg-primary hover:bg-primaryHover text-white font-bold p-3 rounded transition-colors">
                                {loading ? 'Entrando...' : 'ENTRAR'}
                            </button>
                            
                             <div className="mt-8 pt-8 border-t border-border grid grid-cols-3 gap-4 text-xs">
                                <a href="https://mpago.la/2p41zpx" target="_blank" className="block p-2 bg-background rounded border border-border hover:border-primary">Iniciante</a>
                                <a href="https://mpago.la/342uX85" target="_blank" className="block p-2 bg-background rounded border border-primary text-primary font-bold">Profissional</a>
                                <a href="https://mpago.la/1TJHEY3" target="_blank" className="block p-2 bg-background rounded border border-border hover:border-primary">Studio</a>
                            </div>
                        </div>
                    </div>
                );
            }

            // TELA PRINCIPAL (IGUAL AO PRINT)
            return (
                <div className="min-h-screen pb-10">
                    {/* Header */}
                    <header className="bg-background border-b border-border py-4 px-6 flex justify-between items-center mb-8">
                        <div className="flex items-center gap-2 font-bold text-xl">
                            <div className="bg-primary/20 p-2 rounded"><Icon name="pen-tool" className="text-primary" /></div>
                            InkEstimate <span className="text-primary">Pro</span>
                        </div>
                         <div className="flex items-center gap-4">
                            <span className="text-sm bg-surface px-3 py-1 rounded border border-border">💰 {user.credits}</span>
                            <button onClick={() => setUser(null)} className="text-zinc-500 hover:text-white"><Icon name="log-out" /></button>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-4">
                        {/* ABAS DO PRINT */}
                        <div className="grid grid-cols-3 md:grid-cols-6 gap-2 mb-6">
                            {[
                                {id:'price', label:'PREÇO', icon:'calculator'},
                                {id:'letras', label:'LETRAS', icon:'type'},
                                {id:'artes', label:'ARTES', icon:'image'},
                                {id:'insta', label:'INSTA', icon:'instagram'},
                                {id:'vendas', label:'VENDAS', icon:'message-square'},
                                {id:'jobs', label:'JOBS', icon:'history'}
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center justify-center gap-2 p-4 rounded-xl border transition-all ${activeTab === tab.id ? 'bg-primary border-primary text-white shadow-lg shadow-blue-900/20' : 'bg-surface border-border text-zinc-500 hover:bg-zinc-900'}`}>
                                    <Icon name={tab.icon} />
                                    <span className="text-[10px] font-bold tracking-widest">{tab.label}</span>
                                </button>
                            ))}
                        </div>

                        {/* INPUTS DE NOME (IGUAL AO PRINT) */}
                        <div className="grid grid-cols-2 gap-4 mb-6">
                             <div className="relative">
                                <Icon name="user" className="absolute left-3 top-3 text-zinc-500 w-4 h-4"/>
                                <input type="text" value={clientName} onChange={e => setClientName(e.target.value)} placeholder="Nome do Cliente" className="w-full bg-surface border border-border rounded-lg py-2.5 pl-10 pr-4 text-sm text-white focus:border-primary outline-none" />
                             </div>
                             <div className="relative">
                                <Icon name="home" className="absolute left-3 top-3 text-zinc-500 w-4 h-4"/>
                                <input type="text" value={studioName} onChange={e => setStudioName(e.target.value)} placeholder="Seu Estúdio" className="w-full bg-surface border border-border rounded-lg py-2.5 pl-10 pr-4 text-sm text-white focus:border-primary outline-none" />
                             </div>
                        </div>

                        <hr className="border-primary/30 mb-8" />

                        {/* CALCULADORA (LAYOUT DO PRINT) */}
                        {activeTab === 'price' && (
                            <div className="grid md:grid-cols-2 gap-8">
                                <div className="space-y-6">
                                    {/* Largura e Altura */}
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs text-zinc-500 mb-1 block">Largura (cm)</label>
                                            <input type="number" value={width} onChange={e => setWidth(Number(e.target.value))} className="w-full input-dark p-3" />
                                        </div>
                                        <div>
                                            <label className="text-xs text-zinc-500 mb-1 block">Altura (cm)</label>
                                            <input type="number" value={height} onChange={e => setHeight(Number(e.target.value))} className="w-full input-dark p-3" />
                                        </div>
                                    </div>
                                    <div className="text-center text-xs text-amber-500 font-bold">⚡ Área Total: {width * height} cm²</div>

                                    {/* Estilo e Complexidade */}
                                    <div>
                                        <label className="text-xs text-zinc-500 mb-2 block font-bold flex items-center gap-2"><Icon name="layers" size={12}/> Estilo & Complexidade</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {['Nível 1: Traços', 'Nível 2: Sombreado', 'Nível 3: Colorido', 'Nível 4: Cobertura'].map(lvl => (
                                                <button key={lvl} onClick={() => setStyle(lvl)} className={`p-3 rounded text-xs border text-left ${style === lvl ? 'bg-white text-black border-white font-bold' : 'bg-background border-border text-zinc-400'}`}>
                                                    {lvl}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Local e Extras */}
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs text-zinc-500 mb-1 block">Local do Corpo</label>
                                            <select value={bodyPart} onChange={e => setBodyPart(e.target.value)} className="w-full input-dark p-3 text-xs">
                                                <option>Braço/Antebraço</option>
                                                <option>Perna/Panturrilha</option>
                                                <option>Costela/Barriga</option>
                                                <option>Pescoço/Rosto</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs text-amber-500 mb-1 block">Custos Extras (R$)</label>
                                            <input type="number" value={extras} onChange={e => setExtras(Number(e.target.value))} className="w-full input-dark p-3" />
                                            <p className="text-[10px] text-zinc-600 mt-1">Deslocamento, Agulha Extra...</p>
                                        </div>
                                    </div>

                                    {/* Botão Somar */}
                                    <button onClick={calculate} className="w-full bg-white hover:bg-zinc-200 text-black font-black py-4 rounded-lg uppercase text-xs tracking-widest flex items-center justify-center gap-2">
                                        <Icon name="calculator" size={16} /> SOMAR E CALCULAR ORÇAMENTO (1 MOEDA)
                                    </button>
                                </div>

                                {/* Resultado */}
                                <div className="bg-surface border border-border rounded-xl flex flex-col items-center justify-center p-8 text-center min-h-[300px]">
                                    {result ? (
                                        <div className="animate-in fade-in zoom-in">
                                            <p className="text-zinc-500 text-xs uppercase tracking-widest mb-2">Valor Estimado</p>
                                            <div className="text-6xl font-bold text-white mb-2">R$ {result}</div>
                                            <p className="text-zinc-400 text-sm mb-6">Sugestão baseada em {width}x{height}cm</p>
                                            <button className="bg-primary/10 text-primary px-4 py-2 rounded-full text-xs font-bold hover:bg-primary hover:text-white transition-all">Copiar Valor</button>
                                        </div>
                                    ) : (
                                        <div className="text-zinc-600">
                                            <Icon name="dollar-sign" size={48} className="mx-auto mb-4 opacity-20"/>
                                            <p className="text-sm">Preencha os dados ao lado e clique em<br/>calcular para ver a estimativa.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* OUTRAS ABAS (IA) */}
                        {(activeTab === 'letras' || activeTab === 'artes' || activeTab === 'insta') && (
                            <div className="bg-surface border border-border p-6 rounded-xl">
                                <h2 className="text-xl text-white font-bold mb-4 flex items-center gap-2">
                                    <Icon name="sparkles" className="text-primary"/> IA Generator
                                </h2>
                                <textarea value={aiInput} onChange={e => setAiInput(e.target.value)} className="w-full h-32 input-dark p-4 mb-4" placeholder="Descreva o que você quer..."></textarea>
                                <button onClick={() => runAI(activeTab === 'insta' ? 'insta' : 'stencil')} disabled={aiLoading} className="bg-primary text-white px-6 py-3 rounded font-bold">
                                    {aiLoading ? 'Gerando...' : 'Gerar com IA'}
                                </button>
                                {aiResult && <div className="mt-4 p-4 bg-background rounded border border-border whitespace-pre-wrap text-sm text-zinc-300">{aiResult}</div>}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
