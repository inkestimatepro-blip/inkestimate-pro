<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkEstimate Pro - Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Cinzel', 'serif'] },
            colors: {
              ink: { 950: '#050505', 900: '#0f0f0f', 800: '#1a1a1a', 700: '#262626' },
              gold: { 400: '#FFD700', 500: '#D4AF37', 600: '#B8860B' }
            },
            backgroundImage: {
              'premium-gradient': 'radial-gradient(circle at top center, #1a1500 0%, #050505 70%)',
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #050505; color: #E5E5E5; font-family: 'Inter', sans-serif; }
      
      /* Efeito de Vidro Premium */
      .glass {
        background: rgba(20, 20, 20, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      }
      
      .glass-gold {
        background: rgba(212, 175, 55, 0.05);
        border: 1px solid rgba(212, 175, 55, 0.2);
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
      }

      .text-glow { text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
      
      /* Animação de carregamento */
      .loading-dots:after { content: '.'; animation: dots 1.5s steps(5, end) infinite; }
      @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }
    </style>
</head>
<body class="bg-premium-gradient min-h-screen selection:bg-gold-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createClient } = supabase;

        // --- CONEXÕES ---
        const GOOGLE_API_KEY = "AIzaSyBVUt_unky3f0D4qzDutg69HH7PxHQ6dso"; 
        const supabaseUrl = 'https://igmdplccgvlcfrffwgpm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnbWRwbGNjZ3ZsY2ZyZmZ3Z3BtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1OTM0NDYsImV4cCI6MjA4NDE2OTQ0Nn0.Uy9NGijSIXytVYw-19szOXdet96uiY8xHQlW36K7xAg';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        // --- IA (Cérebro) ---
        async function callGemini(prompt) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GOOGLE_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Erro: A IA não respondeu.";
            } catch (error) { return "Erro de conexão com a IA."; }
        }

        const Icon = ({ name, className }) => <i data-lucide={name} className={className}></i>;

        const App = () => {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [loading, setLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('price');
            
            // Dados Calculadora
            const [width, setWidth] = useState(10);
            const [height, setHeight] = useState(10);
            const [complexity, setComplexity] = useState(1.0);
            const [price, setPrice] = useState(null);

            // Dados IA
            const [aiInput, setAiInput] = useState('');
            const [aiResult, setAiResult] = useState('');
            const [aiLoading, setAiLoading] = useState(false);

            useEffect(() => { lucide.createIcons(); }, [user, activeTab, price, aiResult]);

            const handleLogin = async () => {
                setLoading(true);
                const { data } = await supabaseClient.from('clientes').select('*').eq('email', email.trim().toLowerCase()).single();
                if (data) setUser(data); else alert('E-mail não encontrado! Verifique se você já tem cadastro.');
                setLoading(false);
            };

            const calculatePrice = () => {
                setPrice(Math.ceil((100 + (width * height * 2.5)) * complexity));
            };

            const generateAI = async (type) => {
                if (!aiInput) return alert('Descreva sua ideia primeiro!');
                if ((user.credits || 0) < 1) return alert('Saldo insuficiente!');
                
                setAiLoading(true); setAiResult('');
                
                const newCredits = (user.credits || 0) - 1;
                await supabaseClient.from('clientes').update({ credits: newCredits }).eq('id', user.id);
                setUser({...user, credits: newCredits});

                const prompt = type === 'stencil' 
                    ? `Aja como um tatuador expert. Crie um guia técnico detalhado para o stencil desta arte: "${aiInput}". \nSepare a resposta em:\n1. CAMADAS PRINCIPAIS (O que decalcar primeiro)\n2. MAPEAMENTO DE SOMBRAS (Onde marcar preto sólido)\n3. AGULHAS SUGERIDAS (RL para traço, Magnum para pintura)` 
                    : `Crie uma legenda de Instagram vendedora e profissional para um tatuador postar a arte: "${aiInput}". \nInclua: Título Chamativo, Texto Emocional sobre a arte, Chamada para Agendamento e 5 Hashtags de alto alcance.`;
                
                const text = await callGemini(prompt);
                setAiResult(text);
                setAiLoading(false);
            };

            // --- TELA 1: LOGIN E PLANOS (O Visual Luxo voltou) ---
            if (!user) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
                        <div className="text-center mb-12 relative z-10 animate-in fade-in zoom-in duration-700">
                            <div className="inline-flex items-center justify-center p-4 rounded-full glass-gold mb-6">
                                <Icon name="pen-tool" className="text-gold-500 w-10 h-10" />
                            </div>
                            <h1 className="text-5xl md:text-6xl font-display font-bold text-white mb-2 text-glow">
                                InkEstimate <span className="text-gold-500">Pro</span>
                            </h1>
                            <p className="text-zinc-400 uppercase tracking-[0.3em] text-sm">Plataforma de Elite</p>
                        </div>

                        <div className="grid md:grid-cols-3 gap-6 w-full max-w-6xl mb-16 px-4 relative z-10">
                            {[
                                { name: 'Iniciante', price: '29,90', credits: 100, link: 'https://mpago.la/2p41zpx', feat: 'Acesso Básico', icon: 'zap' },
                                { name: 'Profissional', price: '59,90', credits: 400, link: 'https://mpago.la/342uX85', feat: 'Acesso Completo + IA', best: true, icon: 'star' },
                                { name: 'Studio', price: '149,90', credits: 1000, link: 'https://mpago.la/1TJHEY3', feat: 'Multi-usuário', icon: 'crown' }
                            ].map(plan => (
                                <div key={plan.name} className={`glass p-8 rounded-3xl relative transition-all duration-300 hover:-translate-y-2 hover:shadow-gold-500/10 ${plan.best ? 'border-gold-500/50 bg-gold-500/5 scale-105 z-20' : 'border-white/5'}`}>
                                    {plan.best && <span className="absolute -top-4 left-1/2 -translate-x-1/2 bg-gold-500 text-black text-[10px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest shadow-lg shadow-gold-500/20">Recomendado</span>}
                                    <div className="flex justify-between items-start mb-6">
                                        <div className={`p-3 rounded-2xl ${plan.best ? 'bg-gold-500 text-black' : 'bg-ink-800 text-zinc-400'}`}><Icon name={plan.icon} className="w-6 h-6" /></div>
                                        <h3 className="text-xl font-bold text-white">{plan.name}</h3>
                                    </div>
                                    <div className="mb-6">
                                        <span className="text-sm text-zinc-500 font-bold">R$</span>
                                        <span className="text-4xl font-display font-bold text-white mx-1">{plan.price}</span>
                                        <span className="text-xs text-zinc-500 uppercase">/mês</span>
                                    </div>
                                    <ul className="space-y-4 mb-8">
                                        <li className="flex items-center gap-3 text-sm text-zinc-300"><Icon name="coins" className="text-gold-500 w-4 h-4" /> {plan.credits} Moedas</li>
                                        <li className="flex items-center gap-3 text-sm text-zinc-300"><Icon name="check-circle" className="text-green-500 w-4 h-4" /> {plan.feat}</li>
                                    </ul>
                                    <a href={plan.link} target="_blank" className={`block w-full py-4 rounded-xl font-black text-center text-xs uppercase tracking-widest transition-all ${plan.best ? 'bg-gold-500 text-black hover:bg-gold-400 shadow-lg shadow-gold-500/20' : 'bg-white text-black hover:bg-zinc-200'}`}>Assinar Agora</a>
                                </div>
                            ))}
                        </div>

                        <div className="glass p-8 rounded-3xl w-full max-w-md border-t border-white/10 relative z-10">
                            <p className="text-center text-zinc-500 text-[10px] uppercase font-bold tracking-widest mb-6">Já é membro assinante?</p>
                            <div className="space-y-4">
                                <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="Seu E-mail de Acesso" className="w-full bg-ink-950/50 border border-ink-700 text-white p-4 rounded-xl text-center focus:border-gold-500 outline-none transition-all placeholder:text-zinc-700" />
                                <button onClick={handleLogin} disabled={loading} className="w-full bg-gold-500 text-black font-black p-4 rounded-xl uppercase tracking-widest hover:bg-gold-400 transition-all flex items-center justify-center gap-2 shadow-lg shadow-gold-500/10">
                                    {loading ? <span className="loading-dots">Verificando</span> : <span>Acessar Sistema <Icon name="arrow-right" className="w-4 h-4 inline" /></span>}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- TELA 2: SISTEMA (Dashboard Premium) ---
            return (
                <div className="min-h-screen pb-20">
                    <header className="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center mb-10 border-b border-white/5 backdrop-blur-xl">
                        <span className="font-display font-bold text-xl text-white flex gap-3 items-center">
                            <div className="bg-gold-500 p-1.5 rounded text-black"><Icon name="pen-tool" className="w-5 h-5"/></div>
                            InkEstimate <span className="text-gold-500">Pro</span>
                        </span>
                        <div className="flex items-center gap-4">
                            <span className="glass px-4 py-2 rounded-full text-gold-500 text-xs font-black uppercase tracking-wide border-gold-500/30 flex items-center gap-2">
                                <Icon name="coins" className="w-3 h-3" /> {user.credits} Moedas
                            </span>
                            <button onClick={() => setUser(null)} className="text-zinc-600 hover:text-red-500 transition-colors"><Icon name="log-out" className="w-5 h-5" /></button>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-4">
                        <div className="flex justify-center gap-4 mb-10 overflow-x-auto pb-4">
                            {[
                                {id:'price', l:'Calculadora', i:'calculator'}, 
                                {id:'stencil', l:'IA Stencil', i:'layers'}, 
                                {id:'marketing', l:'IA Social', i:'instagram'}
                            ].map(t => (
                                <button key={t.id} onClick={() => { setActiveTab(t.id); setAiResult(''); }} className={`flex items-center gap-3 px-8 py-4 rounded-2xl border transition-all duration-300 group ${activeTab === t.id ? 'bg-gold-500 text-black border-gold-500 font-bold shadow-xl shadow-gold-500/20 scale-105' : 'glass text-zinc-500 border-white/5 hover:border-zinc-700 hover:text-white'}`}>
                                    <Icon name={t.i} className={`w-5 h-5 ${activeTab !== t.id && 'group-hover:text-gold-500 transition-colors'}`} /> 
                                    <span className="text-xs uppercase tracking-widest">{t.l}</span>
                                </button>
                            ))}
                        </div>

                        {activeTab === 'price' && (
                            <div className="glass p-8 md:p-12 rounded-[2.5rem] animate-in fade-in slide-in-from-bottom-8 duration-700 grid md:grid-cols-2 gap-12 items-center border border-white/5">
                                <div className="space-y-8">
                                    <div className="grid grid-cols-2 gap-6">
                                        <div>
                                            <label className="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-3 block">Largura (cm)</label>
                                            <input type="number" value={width} onChange={e=>setWidth(Number(e.target.value))} className="w-full bg-ink-900 border border-ink-800 p-5 rounded-2xl text-white font-display font-bold text-center text-2xl focus:border-gold-500 focus:shadow-[0_0_20px_rgba(212,175,55,0.1)] outline-none transition-all"/>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-3 block">Altura (cm)</label>
                                            <input type="number" value={height} onChange={e=>setHeight(Number(e.target.value))} className="w-full bg-ink-900 border border-ink-800 p-5 rounded-2xl text-white font-display font-bold text-center text-2xl focus:border-gold-500 focus:shadow-[0_0_20px_rgba(212,175,55,0.1)] outline-none transition-all"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-3 block">Nível de Detalhe</label>
                                        <div className="grid grid-cols-3 gap-3">
                                            {[{l:'Traço',v:1.0}, {l:'Sombra',v:1.3}, {l:'Realismo',v:1.8}].map(o => (
                                                <button key={o.l} onClick={() => setComplexity(o.v)} className={`py-4 rounded-xl text-[10px] uppercase font-black tracking-widest border transition-all ${complexity === o.v ? 'bg-gold-500 text-black border-gold-500 shadow-lg shadow-gold-500/20' : 'bg-ink-950 border-ink-800 text-zinc-600 hover:border-zinc-600 hover:text-zinc-300'}`}>{o.l}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <button onClick={calculatePrice} className="w-full bg-white hover:bg-zinc-200 text-black font-black py-5 rounded-2xl uppercase tracking-[0.2em] text-xs transition-all shadow-xl hover:scale-[1.02]">Calcular Orçamento</button>
                                </div>
                                <div className="h-full flex flex-col items-center justify-center bg-ink-950/50 rounded-3xl p-8 border border-white/5 relative overflow-hidden group">
                                    <div className="absolute inset-0 bg-gold-500/5 blur-3xl group-hover:bg-gold-500/10 transition-all duration-700"></div>
                                    {price ? (
                                        <div className="relative z-10 text-center animate-in zoom-in duration-500">
                                            <p className="text-zinc-500 text-[10px] font-black uppercase tracking-[0.3em] mb-4">Valor Sugerido</p>
                                            <div className="text-7xl font-display font-bold text-gold-500 text-glow mb-4">R$ {price}</div>
                                            <p className="text-zinc-400 text-xs font-medium bg-ink-900/50 px-4 py-2 rounded-full inline-block border border-white/5">Baseado em {width}x{height}cm</p>
                                        </div>
                                    ) : (
                                        <div className="relative z-10 text-center opacity-30">
                                            <Icon name="dollar-sign" className="w-16 h-16 mx-auto mb-4" />
                                            <p className="text-sm font-bold uppercase tracking-widest">Aguardando dados</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {(activeTab === 'stencil' || activeTab === 'marketing') && (
                            <div className="glass p-8 md:p-12 rounded-[2.5rem] animate-in fade-in slide-in-from-bottom-8 duration-700 border border-gold-500/20 relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-64 h-64 bg-gold-500/10 blur-[100px] pointer-events-none"></div>
                                
                                <div className="relative z-10">
                                    <h2 className="text-3xl font-display font-bold text-white mb-6 flex items-center gap-3">
                                        <div className="bg-ink-900 p-3 rounded-2xl border border-gold-500/30">
                                            <Icon name={activeTab === 'stencil' ? 'layers' : 'instagram'} className="text-gold-500 w-6 h-6"/>
                                        </div>
                                        {activeTab === 'stencil' ? 'Gerador de Stencil IA' : 'Marketing IA'}
                                    </h2>
                                    
                                    <textarea value={aiInput} onChange={e => setAiInput(e.target.value)} placeholder={activeTab === 'stencil' ? "Descreva a tatuagem... (Ex: Leão realista no antebraço com rosas...)" : "Descreva a arte para o post... (Ex: Tatuagem delicada de borboleta, cliente emocionada...)"} className="w-full h-40 bg-ink-950/80 border border-ink-800 rounded-2xl p-6 text-white text-lg focus:border-gold-500 focus:shadow-[0_0_30px_rgba(212,175,55,0.1)] outline-none mb-8 resize-none placeholder:text-zinc-700 transition-all"></textarea>
                                    
                                    <button onClick={() => generateAI(activeTab)} disabled={aiLoading} className="w-full bg-gradient-to-r from-gold-600 to-gold-400 text-black font-black py-5 rounded-2xl uppercase tracking-[0.2em] text-xs hover:scale-[1.01] transition-all flex justify-center items-center gap-3 shadow-xl shadow-gold-500/20">
                                        {aiLoading ? <span className="loading-dots">Processando Inteligência</span> : <span><Icon name="sparkles" className="w-4 h-4 inline" /> Gerar Conteúdo (1 Moeda)</span>}
                                    </button>
                                    
                                    {aiResult && (
                                        <div className="mt-10 bg-ink-950/80 p-8 rounded-3xl border border-ink-800 relative group animate-in slide-in-from-bottom-4">
                                            <div className="absolute -left-1 top-10 w-1 h-12 bg-gold-500 rounded-r-full"></div>
                                            <div className="text-zinc-300 whitespace-pre-wrap leading-relaxed font-light">{aiResult}</div>
                                            <button onClick={() => { navigator.clipboard.writeText(aiResult); alert('Copiado!'); }} className="absolute top-6 right-6 text-zinc-500 hover:text-gold-500 bg-ink-900 p-3 rounded-xl border border-ink-800 transition-all hover:border-gold-500"><Icon name="copy" className="w-5 h-5" /></button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
